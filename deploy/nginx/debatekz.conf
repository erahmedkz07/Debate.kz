# nginx site for Debate.kz: one domain for the site and the API (same-site session cookies).
# Install: sudo cp deploy/nginx/debatekz.conf /etc/nginx/sites-available/debatekz
#          sudo sed -i 's/debate.kz/YOUR_DOMAIN/g' /etc/nginx/sites-available/debatekz   (if the domain differs)
#          sudo ln -s /etc/nginx/sites-available/debatekz /etc/nginx/sites-enabled/ && sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d debate.kz -d www.debate.kz      (adds HTTPS and the 80 -> 443 redirect)

server {
    listen 80;
    listen [::]:80;
    server_name debate.kz www.debate.kz;

    root /opt/debatekz/frontend/dist;
    index index.html;

    # receipts are up to 10 MB (multipart adds a little)
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # the API (Express on localhost only)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # avatars, logos, covers: straight from disk, names never change
    location /uploads/ {
        alias /var/lib/debatekz/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # built JS/CSS carry a hash in the name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the SPA: any other path is a page of the app (refresh on /tournaments/... must not 404)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
